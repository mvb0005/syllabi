name: lms-mothership-v3

# A fixed-name network so VS Code MCP clients can always reach
# running services regardless of mothership version number.
networks:
  lms-network:
    name: lms-network
  # Backend <-> compiler only. `internal` means no host ports and no
  # outbound internet from the compiler container.
  compile-network:
    name: lms-compile-network
    internal: true

services:
  # --------------------------------------------------
  # 1. Dev Workstation
  # --------------------------------------------------
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bullseye
    env_file:
      - ../.env
    volumes:
      - ../:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: /bin/sh -c "while sleep 1000; do :; done"
    networks:
      - lms-network

  # --------------------------------------------------
  # 2. Database
  # --------------------------------------------------
  db:
    image: postgres:15-alpine
    restart: always
    container_name: lms-db
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lms-network

  # --------------------------------------------------
  # 2b. Backend API (FastAPI; runs alembic migrations on start)
  # --------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://lms_user:lms_password@db:5432/lms_db
      SOURCES_DIR: /workspace/sources
    volumes:
      - ../:/workspace:cached
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms-network
      - compile-network

  # --------------------------------------------------
  # 2b'. C++ -> WASM compile service (internal only; backend proxies to it)
  # --------------------------------------------------
  compiler:
    build:
      context: ../compiler
    container_name: lms-compiler
    restart: unless-stopped
    # Handles untrusted student source (compile only — nothing is executed
    # here), so it runs with no internet, no capabilities, no privilege
    # escalation, and bounded memory/processes/CPU. The rootfs stays
    # writable because emcc needs its cache and temp build dirs.
    networks:
      - compile-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 256
    cpus: 2

  # --------------------------------------------------
  # 2c. Frontend (Vite dev server; /api proxied to backend)
  # --------------------------------------------------
  frontend:
    build:
      context: ../frontend
    container_name: lms-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - lms-network

  # --------------------------------------------------
  # 3. MCP Servers (stable container_name so mcp.json never needs updating)
  # --------------------------------------------------
  mcp-postgres:
    image: node:22-alpine
    container_name: lms-mcp-postgres
    command: ["npx", "-y", "mcp-postgres-server", "postgresql://lms_user:lms_password@db:5432/lms_db"]
    depends_on:
      db:
        condition: service_started
    volumes:
      - ../:/workspace:ro
    stdin_open: true
    tty: true
    networks:
      - lms-network

  mcp-memory:
    image: node:22-alpine
    container_name: lms-mcp-memory
    command: ["npx", "-y", "@modelcontextprotocol/server-memory"]
    volumes:
      - ../:/workspace:ro
      - mcp-memory-data:/app/dist
    stdin_open: true
    tty: true
    networks:
      - lms-network

  mcp-filesystem:
    image: node:22-alpine
    container_name: lms-mcp-filesystem
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
    volumes:
      - ../:/workspace:rw
    stdin_open: true
    tty: true
    networks:
      - lms-network

  mcp-github:
    image: ghcr.io/github/github-mcp-server:latest
    container_name: lms-mcp-github
    env_file:
      - ../.env
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}
    volumes:
      - ../:/workspace:ro
    stdin_open: true
    tty: true
    networks:
      - lms-network

  mcp-docker:
    image: mcp/docker:latest
    container_name: lms-mcp-docker
    # Mounts the host Docker socket so the MCP server can manage containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true
    networks:
      - lms-network

volumes:
  mcp-memory-data:
  postgres-data: